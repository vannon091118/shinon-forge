name: Shinon Forge Gate

# Ein Wächter, der nur manchmal hinsieht, ist kein Wächter: dieser Workflow läuft
# bei jedem Push und jedem Pull Request, ohne Filter und ohne Bedingung — und auf
# Zuruf für ein volles Historie-Audit.
#
# KEIN MONOLITH. Jeder Vertrag ist ein eigener Zweig mit eigenem Läufer und eigenem
# Namen in der Oberfläche: eine rote Prüfung benennt damit den gebrochenen Vertrag,
# statt eine Kette aus neun Stufen zu verstecken, bei der nur die erste rote Zeile
# sagt, was wirklich kaputt ist. Die schweren Zweige laufen PARALLEL, deshalb kostet
# die Aufteilung keine Wanduhr-Zeit — sie gewinnt welche, weil die früheren Läufe
# fünf Stufen des Vertrags gar nicht gefahren haben (Fixtures, Distribution,
# Profilboot, Static-Gate, Prompter).
#
# ZWEI GESCHWINDIGKEITEN, gemessen (leerer Baum aus `git archive`, kein node_modules,
# kein `dsh` im PATH — genau die Bedingung eines frischen Läufers):
#   * OHNE Install: `commit-guard` und die `unit`-Matrix. 8 Suiten in Sekunden
#     zusammen, jede Exit 0 — Zusagen (Stand 2026-10-17): codingmon 46, hook 1,
#     narrative 13, scoring 50, token-usage 13, popup 12, key-router 17, traceability 12.
#     Der Verzicht spart je Zweig einen Baum von 726 Paketen (467 MB,
#     16 s) — und der Hook-Zweig ist als fail-closed nachgewiesen: Fixture auf zwei
#     Events gekürzt ⇒ Exit 1.
#   * MIT Install (`npm ci`, lockfile-treu: Exit 0, 14 s, 726 Pakete; eine Drift
#     zwischen package.json und package-lock.json bricht den Zweig ab, statt sie
#     still aufzulösen): alles, was `dsh`, `@deepseek-ai/schemastery` oder den
#     TypeScript-Compiler braucht. `node_modules/.bin` wandert über $GITHUB_PATH in
#     den PATH, weil scripts/shinon-profile-test.mjs `dsh` namentlich aufruft und
#     scripts/lib/dsh.mjs einen PATH-Shim nur mit SHINON_ALLOW_PATH_DSH=1 zulässt.
#
# Fail-closed in beide Richtungen:
#   * Jeder Commit mit KI-Footer (Codebuff und Verwandte) oder ohne Vannon-Trailer
#     bricht den Lauf ab (Exit 1).
#   * Lässt sich der Prüfbereich nicht bestimmen (neuer Branch, Force-Push,
#     flacher Klon), prüft der Wächter die volle Historie — nie weniger.
#   * Der letzte Job (verdict) wird rot bei failure, cancelled UND skipped: ein
#     übersprungener Zweig ist kein grüner Zweig.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Zweig 1: die Commit-Regeln selbst (kein node_modules) ───────────────────
  commit-guard:
    name: Commit-Wächter (Footer + Trailer)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Volle Historie: der Wächter muss bis zur PR-Basis (und im Zweifel bis
          # zum ersten Commit) zurücksehen können.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Commits prüfen (Bereich leitet der Wächter selbst ab)
        run: node scripts/commit-guard.mjs --ci

  # ── Zweig 2: Paket-Suiten ohne Abhängigkeiten (Matrix, je ~10 s) ────────────
  # Diese acht Suiten brauchen weder node_modules noch `dsh` noch ein Modell —
  # gemessen im leeren Baum. Sie melden deshalb in unter einer halben Minute,
  # während die Install-Zweige noch ihren Baum aufbauen.
  # `prompter` steht hier bewusst NICHT: sein Test importiert ../index.js und
  # damit @deepseek-ai/schemastery; er läuft im eigenen Zweig mit node_modules.
  # `codingmon/uebergabe` läuft hier nur als SICHTBARER Skip (braucht `dsh`);
  # voll gefahren wird sie in Zweig 3, wo der Install-Baum steht.
  # Dasselbe gilt für JEDE Host-Naht: ein `../index.js`-Import in einer
  # Paket-Suite macht diesen Zweig rot (gemessen 2026-10-17, Job 117312423811,
  # `ERR_MODULE_NOT_FOUND: @deepseek-ai/schemastery`) — solche Tests gehören
  # nach `scripts/gate/tests/`, wo `npm ci` gelaufen ist.
  unit:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Ein roter Bein-Zweig darf die anderen nicht abschneiden: alle acht sollen
      # ihr Urteil abgeben, sonst versteckt der erste Fehler den zweiten.
      fail-fast: false
      matrix:
        include:
          - name: Codemon-Engine (Mathematik, Beute, Keyframes)
            run: node --test packages/codingmon/test/*.test.mjs
          - name: Hook-Replay (Fixture-Orakel + Client-Plugin-Form)
            run: node packages/hook/test/replay.test.mjs
          - name: Narrative-Kern
            run: node --test packages/narrative/test/*.test.mjs
          - name: Scoring-Signale (rein, ohne DSH)
            run: node --test packages/scoring/test/*.test.mjs
          - name: Token-Usage-Kern
            run: node --test packages/token-usage/test/*.test.mjs
          - name: Popup-Kern (Trajektorien-Fenster)
            run: node --test packages/popup/test/*.test.mjs
          - name: Key-Router-Kern (Wartezeit, Auswahl, Redaktion)
            run: node --test packages/key-router/test/*.test.mjs
          - name: Traceability-Kern (Toast-Fenster)
            run: node --test packages/traceability/test/*.test.mjs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}

  # ── Zweig 3: die Gate-Tests (schwerster Zweig, ~90 s) ───────────────────────
  # Die DSH-abhängigen Tests (uebergabe, store, prompter-contract, …) brauchen
  # `dsh` im PATH; ohne ihn melden sie sichtbar einen Skip (REGEL: ein Skip ist
  # kein Grün). Deshalb hier `npm ci` — und `dsh` liegt danach in
  # `node_modules/.bin/dsh` und wird über $GITHUB_PATH sichtbar.
  gate-rules:
    name: Gate-Tests (Regeln, Verträge, Nähte)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren (lockfile-treu) und dsh in den PATH legen
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Gate-Tests fahren
        run: node --test scripts/gate/tests/*.test.mjs

      # Die Client→Host-Übergabe der Codemon-Suite braucht denselben Install-Baum
      # (`dsh` im PATH, echte Typert-Brücke); in der Unit-Matrix ohne Install
      # meldet sie nur einen sichtbaren Skip. Hier läuft sie voll — sonst hätte
      # die zentrale Testlinie genau die Naht nie gefahren, die den Client mit
      # dem Host verheiratet.
      - name: Codemon-Übergabe fahren (volle Naht, mit Install)
        run: node --test packages/codingmon/test/uebergabe.test.mjs

  # ── Zweig 4: das statische Gate (105 Prüfungen) ─────────────────────────────
  static-gate:
    name: Statisches Gate (manifest, name contract, Profile)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren (lockfile-treu) und dsh in den PATH legen
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Statisches Gate fahren
        run: node scripts/shinon-test.mjs

      # Eine Sollquelle, ein Prüfer: Matrix, Manifeste, Lock, Vendor, Installat
      # und CLI müssen dieselbe Fassung nennen. Derselbe Befehl läuft lokal und
      # im Updater — eine zweite Implementierung gibt es nicht.
      - name: DSH-Versionen prüfen (Sollquelle, Lock, Vendor, Installat, CLI)
        run: node scripts/check-dsh-versions.mjs

  # ── Zweig 5: die Fixtures (Validierung, ~36 s) ──────────────────────────────
  fixtures:
    name: Fixtures (Validierung gegen den echten Bau)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren (lockfile-treu) und dsh in den PATH legen
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Fixtures fahren
        run: node scripts/validate-test.mjs

  # ── Zweig 6: die Auslieferung (je Paket packen, isoliert installieren, laden)
  distribution:
    name: Distribution (npm pack → Isolat → Laden)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren (lockfile-treu) und dsh in den PATH legen
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Distribution fahren
        run: node scripts/pack-test.mjs

  # ── Zweig 7: der Profilboot (jeder Bundle-Layer muss auflösen) ──────────────
  profile:
    name: Profilboot (dsh --profile shinon --dump-config)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren (lockfile-treu) und dsh in den PATH legen
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Profilboot fahren
        run: node scripts/shinon-profile-test.mjs

  # ── Zweig 8: der Prompter (braucht Schemastery über ../index.js) ────────────
  prompter:
    name: Prompter (Zettel, Skill-Auswahl)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren (lockfile-treu) und dsh in den PATH legen
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Prompter-Tests fahren
        run: node --test packages/prompter/test/*.test.mjs

  # ── Zweig 9: der Typvertrag (gepinnter Compiler + Quellüberdeckung) ─────────
  # Same engine and policy as local checks; missing compiler/config/source coverage fails closed.
  typescript:
    name: TypeScript Gate (gepinnter Compiler + Quellüberdeckung)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren (lockfile-treu) und dsh in den PATH legen
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: TypeScript Gate fahren
        run: npm run typecheck

  # ── Zweig 10: der schnelle Pfad (Sekunden statt Minuten) ────────────────────
  # `npm test` ist seit 2026-10-17 bewusst NICHT die volle Kette, sondern der
  # schnelle lokale Pfad (statisches Gate + lokale Engine-Slices). Dieser Zweig
  # pinnt ihn in CI grün; die volle Kette (`test:full`) fahren die übrigen
  # Zweige nebeneinander — lokal läuft nur der schnelle Pfad.
  quick:
    name: Schnellpfad (npm test, lokal)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren (lockfile-treu) und dsh in den PATH legen
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Schnellen Pfad fahren
        run: npm test

  # ── Verdikt: der EINE Name, den eine Branch-Regel verlangen kann ────────────
  # `if: always()` ist der Punkt: ohne ihn würde dieser Job bei einem roten Zweig
  # gar nicht starten, und die Zusammenfassung wäre bei genau den Läufen stumm,
  # für die sie gebaut ist. Rot bei failure, cancelled UND skipped.
  verdict:
    name: Verdikt (fail-closed)
    needs:
      - commit-guard
      - quick
      - unit
      - gate-rules
      - static-gate
      - fixtures
      - distribution
      - profile
      - prompter
      - typescript
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Alle Zweige müssen grün sein
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          node -e '
            const needs = JSON.parse(process.env.NEEDS);
            const rows = Object.entries(needs).map(([job, run]) => `${job}=${run.result}`);
            console.log(`Zweige: ${rows.join(", ")}`);
            const bad = rows.filter((row) => !row.endsWith("=success"));
            if (bad.length > 0) {
              console.error(`ROT ODER ÜBERSPRUNGEN: ${bad.join(", ")}`);
              console.error("Ein übersprungener Zweig ist kein grüner Zweig: erst grün, wenn alle laufen und bestehen.");
              process.exit(1);
            }
            console.log(`Alle ${rows.length} Zweige grün.`);
          '
