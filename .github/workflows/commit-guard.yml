name: Shinon Commit Guard

# Immer. Kein paths-Filter, keine Bedingung: dieser Job läuft bei jedem Push und
# jedem Pull Request — und auf Zuruf für ein volles Historie-Audit. Ein Wächter,
# der nur manchmal hinsieht, ist kein Wächter.
#
# Fail-closed in beide Richtungen:
#   * Jeder Commit mit KI-Footer (Codebuff und Verwandte) oder ohne Vannon-Trailer
#     bricht den Lauf ab (Exit 1).
#   * Lässt sich der Prüfbereich nicht bestimmen (neuer Branch, Force-Push,
#     flacher Klon), prüft der Wächter die volle Historie — nie weniger.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commit-guard:
    name: Verbotene Footer + Vannon-Trailer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Volle Historie: der Wächter muss bis zur PR-Basis (und im Zweifel bis
          # zum ersten Commit) zurücksehen können.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Commits prüfen (Bereich leitet der Wächter selbst ab)
        run: node scripts/commit-guard.mjs --ci

      - name: Regeln selbst testen (ohne Abhängigkeiten)
        # DSH-Abhängige Tests (uebergabe, store, prompter-contract, …) brauchen
        # `dsh` im PATH; ohne ihn meldet der Test sichtbar einen Skip (REGEL:
        # ein Skip ist kein Grün). Deshalb: `npm install` mit der lock-Datei —
        # `npm ci` ist die saubere Form, keine neuen Auflösungen. `dsh` ist ein
        # Workspace-Paket (package.json bin) und liegt nach `npm install` in
        # `node_modules/.bin/dsh`; das wird in den PATH gelegt.
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          # dsh im PATH: der Binärpfad des DSH-Pakets (link: oder normal).
          if [ -f "node_modules/.bin/dsh" ]; then
            ln -sf "$(pwd)/node_modules/.bin/dsh" /tmp/dsh-bin 2>/dev/null || true
            export PATH="/tmp:$(dirname "$(readlink -f node_modules/.bin/dsh)"):$PATH"
          fi
          # Fallback: node directly.
          export PATH="$(pwd)/node_modules/.bin:$PATH"
          dsh --version || echo "WARNUNG: dsh nicht verfügbar — dsh-Tests werden sichtbar skippen"
          node --test scripts/gate/tests/*.test.mjs

      # Die Einzeltests der Codemon-Engine brauchen kein DSH, keinen Browser und
      # kein Modell — sie laufen hier mit, weil sie sonst nur auf dem Rechner
      # des Autors liefen. Messwert: unter einer Sekunde.
      - name: Codemon-Engine testen (Mathematik, Beute, Keyframes)
        run: node --test packages/codingmon/test/*.test.mjs

      # Die Signaltests des Scorings sind ebenso abhaengigkeitsfrei: sie fahren
      # den reinen Kern (Signal rein, Scorecard-Wert raus, Widerruf, fail-closed).
      # Der Weg ueber beide Pakete (Spine -> Scoring -> Tafel) laeuft ohnehin in
      # den Gate-Tests oben mit.
      - name: Scoring-Signale testen (rein, ohne DSH)
        run: node --test packages/scoring/test/*.test.mjs

      # Same engine and policy as local checks; missing compiler/config/source coverage fails closed.
      - name: TypeScript Gate (pinned compiler + source coverage)
        run: npm run typecheck
