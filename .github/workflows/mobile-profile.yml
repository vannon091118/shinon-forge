name: Shinon Mobile Profile

# Mobile/Android ist aktuell kein Release-Gate (Desktop-/Web-Fundament zuerst).
# Die Profile-Prüfung bleibt manuell aufrufbar, erzeugt aber keinen redundanten
# Pflichtlauf für jeden PR, solange Mobile-Arbeit zurückgestellt ist.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-profile:
    name: Mobile profile contract + DSH resolution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
          cache: npm
      - name: Install locked dependencies
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Mobile profile contract
        run: node scripts/mobile-profile-contract-test.mjs
      - name: Resolve every Mobile DSH layer (no READY claim here)
        run: node scripts/shinon-profile-test.mjs --profile mobile
