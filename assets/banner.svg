<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Shinon Forge — ein DSH-Fork, der Befehle kennt">
  <defs>
    <linearGradient id="bn-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F14"/>
      <stop offset="55%" stop-color="#140F26"/>
      <stop offset="100%" stop-color="#0B0F14"/>
    </linearGradient>
    <linearGradient id="bn-metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="60%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="bn-title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E0E7FF"/>
      <stop offset="100%" stop-color="#A5B4FC"/>
    </linearGradient>
    <radialGradient id="bn-glow" cx="0.18" cy="0.5" r="0.42">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bn-bg)"/>
  <rect width="1280" height="320" fill="url(#bn-glow)"/>

  <!-- Raster: gerade Linien, kein Effekt. -->
  <g stroke="#7C3AED" stroke-opacity="0.10" stroke-width="1">
    <path d="M0 64H1280M0 128H1280M0 192H1280M0 256H1280"/>
    <path d="M160 0V320M320 0V320M480 0V320M640 0V320M800 0V320M960 0V320M1120 0V320"/>
  </g>

  <!-- Amboss + Hammer als Zeichen. -->
  <g transform="translate(84 76) scale(0.3)">
    <g fill="url(#bn-metal)">
      <path d="M74 244 L128 208 H424 V252 H128 Z"/>
      <path d="M206 252 H336 L314 306 H228 Z"/>
      <path d="M152 306 H392 L420 344 H124 Z"/>
    </g>
    <rect x="124" y="344" width="296" height="34" rx="14" fill="#E0E7FF" fill-opacity="0.20"/>
    <g transform="rotate(35 256 256)">
      <rect x="238" y="96" width="118" height="54" rx="14" fill="#E0E7FF"/>
      <rect x="288" y="146" width="20" height="226" rx="10" fill="#A855F7" fill-opacity="0.95"/>
    </g>
    <path d="M318 178 L329 203 L354 214 L329 225 L318 250 L307 225 L282 214 L307 203 Z" fill="#F0F3FF"/>
  </g>

  <text x="300" y="128" font-family="Montserrat, Segoe UI, system-ui, sans-serif" font-size="58" font-weight="800" letter-spacing="1.5" fill="url(#bn-title)">SHINON FORGE</text>
  <text x="302" y="164" font-family="ui-monospace, Menlo, monospace" font-size="19" fill="#A855F7" letter-spacing="1.2">ein DSH-Fork, der Befehle kennt</text>

  <g font-family="ui-monospace, Menlo, monospace" font-size="15">
    <text x="302" y="212" fill="#C7D2FE">kein Agent-Gerede · ein Harness mit Cordis-Paketen</text>
    <text x="302" y="240" fill="#818CF8">Exit-Codes statt Versprechen · eine Zahl je Wahrheit</text>
    <text x="302" y="268" fill="#818CF8">jedes Paket ein Ordner · jedes Gate ein Exit-Code</text>
  </g>

  <g font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#4C5A7A">
    <text x="302" y="296">Zahlen, Belege und offene Arbeit: docs/ZAHLEN.md · docs/ROADMAP.md</text>
  </g>
</svg>
