<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Shinon Forge — Built on DSH. Forged differently.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12071f"/>
      <stop offset="55%" stop-color="#1b0a2e"/>
      <stop offset="100%" stop-color="#071a22"/>
    </linearGradient>
    <linearGradient id="cyber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7b2ff7"/>
      <stop offset="52%" stop-color="#f107a3"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f107a3" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <ellipse cx="240" cy="160" rx="180" ry="150" fill="url(#glow)" filter="url(#soft)"/>

  <!-- Rasterlinien -->
  <g stroke="#7b2ff7" stroke-opacity="0.13" stroke-width="1">
    <path d="M0 60H1280M0 120H1280M0 180H1280M0 240H1280"/>
    <path d="M160 0V320M320 0V320M480 0V320M640 0V320M800 0V320M960 0V320M1120 0V320"/>
  </g>

  <!-- Marke: weibliche Cyberpunk-Persona -->
  <g transform="translate(96 74) scale(5.4)">
    <path fill="url(#cyber)" d="M16 3.2c-5.1 0-8.6 3.4-8.6 8.2 0 3.1 1.1 5.6 3 7.3v3.1c0 .9.7 1.6 1.6 1.6h8c.9 0 1.6-.7 1.6-1.6v-3.1c1.9-1.7 3-4.2 3-7.3 0-4.8-3.5-8.2-8.6-8.2z"/>
    <path fill="#f107a3" opacity="0.85" d="M7.3 10.6C5.9 12 5.2 13.9 5.2 16.1c0 2.9 1 5.3 2.7 7-.6-2.3-.8-4.6-.6-6.9z"/>
    <path fill="#f107a3" opacity="0.85" d="M24.7 10.6c1.4 1.4 2.1 3.3 2.1 5.5 0 2.9-1 5.3-2.7 7 .6-2.3.8-4.6.6-6.9z"/>
    <path fill="#0b0b12" opacity="0.92" d="M9.4 12.1h13.2c.5 0 .9.4.9.9v2.3c0 .5-.4.9-.9.9H9.4c-.5 0-.9-.4-.9-.9v-2.3c0-.5.4-.9.9-.9z"/>
    <circle cx="16" cy="17.4" r="1.5" fill="#00e5ff"/>
    <path fill="#f107a3" opacity="0.85" d="M16 1.4c-.4 0-.7.3-.7.7v1.4c0 .4.3.7.7.7s.7-.3.7-.7V2.1c0-.4-.3-.7-.7-.7z"/>
  </g>

  <!-- Titel -->
  <text x="330" y="140" font-family="Montserrat, Segoe UI, system-ui, sans-serif" font-size="72" font-weight="800" letter-spacing="2" fill="url(#cyber)">SHINON FORGE</text>
  <text x="334" y="182" font-family="Montserrat, Segoe UI, system-ui, sans-serif" font-size="23" font-weight="500" fill="#c9b8e8" letter-spacing="3.5">BUILT ON DSH — FORGED DIFFERENTLY</text>

  <!-- Chips -->
  <g font-family="Montserrat, Segoe UI, system-ui, sans-serif" font-size="15" font-weight="600">
    <rect x="334" y="212" rx="14" ry="14" width="128" height="30" fill="#7b2ff7" fill-opacity="0.18" stroke="#7b2ff7" stroke-opacity="0.6"/>
    <text x="352" y="232" fill="#c9a8ff">7 Bundles</text>
    <rect x="474" y="212" rx="14" ry="14" width="150" height="30" fill="#f107a3" fill-opacity="0.16" stroke="#f107a3" stroke-opacity="0.55"/>
