# Shinon Forge - the canonical `shinon` profile.
#
# `dsh.profile.bundles` in package.json activates the currently supported
# Shinon Forge plugins; each bundle contributes its own patch layer below.
# OpenAPI is deliberately inactive, not accidentally broken: @shinon/openapi
# is neither a bundle nor a dependency of this profile.
#
# This user layer is applied after every bundle layer - a top-level YAML array
# of loader patch entries (id-targeted config overrides, disables, and insert
# lists; `!!js` expressions allowed).

# Task Router (Plan §16/§17): die SCHWELLE und die STOP-POLICY sind
# Entscheidungen, keine Konstanten im Code. Deshalb stehen die wirksamen Werte
# hier und nicht im Paket, wo nur die Schema-Defaults liegen.
#
# threshold=2: MULTI_STEP_TASK (2) und LONG_RUNNING_GOAL (3) sind
# Goal-Kandidaten, CHAT/LOOKUP/TRANSFORM (0) nie.
# minRawLength=24: die Substanzgrenze — ein Zweiwortsatz, den das Modell fuer
# einen Mehrschritt-Auftrag haelt, wird zurueckgestuft. Die einzige
# deterministische Tatsache der Entscheidung, die nicht vom Modell kommt.
#
# activate=false ist die Entscheidung C7 ("sicherer Start bis H5"): der Router
# BEURTEILT weiterhin jede Eingabe (threshold und minRawLength gelten unveraendert)
# und meldet seine Entscheidung — er erzeugt aber KEIN echtes DSH-Goal
# (ctx.goals), und damit keine vom Round-Driver fortgesetzten Runden mit
# vollstaendigen Agentenschritten und Modellaufrufen. Wie viel das wert ist,
# entscheidet H5 (4.6) an Messdaten, nicht an Meinung.
# Zum Anschalten genuegt `activate: true`; die Faehigkeit ist gebaut und getestet
# (docs/probes/task-router.json, docs/probes/goal-micro-state.json).
# maxGoalRounds ist dann SHINONS Stop-Policy: DSH selbst erlaubt 256 Runden
# (defaultMaxGoalRounds). Ein bereits bestehendes Goal wird NIE ueberschrieben.
- id: shinon-task-router
  config:
    threshold: 2
    minRawLength: 24
    activate: false
    maxGoalRounds: 6

# Project Index. `verify` steht hier, weil es eine ENTSCHEIDUNG ist und keine
# Konstante: der wirksame Wert gehoert ins Profil, das Paket haelt nur den
# Schema-Default.
#
# stamp — Shinons Umgang mit der Luecke aus §11: Groesse und mtime werden nicht
# allein geglaubt. Stimmen beide, entscheidet zusaetzlich der Inode-Stempel
# (Geraet, Inode, Groesse, mtime, ctime). Gemessen an diesem Repo (181 Dateien,
# 1,19 MiB): stiller Lauf 0 Bytes gelesen wie 'changed' (58,6 gegen 58,7 ms
# Median, verschraenkt gemessen — der eine stat mehr je Datei ist hier nicht
# messbar), waehrend 'all' JEDEN Lauf 1,2 MB liest (100 ms). Die Luecke —
# gleiche Groesse, zurueckgesetzte mtime — wird 6 von 6 erkannt und kostet
# 24,9 KB (2% des Baums), 'changed' erkennt 0 von 6. Ein Werkzeug, das nur die
# METADATEN des ganzen Baums anfasst, kostet EINEN Vollauf (99%), danach ist es
# wieder still: der Stempel wird mit aufgefrischt.
# 'all' bleibt die Politik, die nichts annimmt — und jeden Lauf alles liest.
- id: shinon-project-index
  config:
    verify: stamp

# @shinon/core owns the sidebar brand. 'sidebar.brand.mark' and
# 'sidebar.brand.name' are single slots (exactly one occupant), so the shipped
# official brand has to yield.
- id: ui-brand-official
  disabled: true
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1

# Modell-Route über den pi-ai-Adapter. `apiKeyEnv` ist nur ein REFERENZNAME:
# das Secret kommt aus der Umgebung (SHINON_API_KEY), nie aus dieser Datei.
# Ohne gesetzte Variable bleibt die Route konfiguriert-aber-schlüssellos.
#
# WER DIE ROUTE WÄHLT: DER NUTZER. `agent-default-model` ist ein live-Feld
# (`dsh-agent-default-model`), die Modellwahl in der UI schreibt sie über den
# gemounteten `config-editor` (`saveSelection`) in GENAU DIESE Datei. Der Wert
# unten ist deshalb der zuletzt gespeicherte Stand und keine Vorgabe des Repos:
# nach einem Wechsel in der UI steht hier eine andere Route, und das ist die
# Zusage, kein Fehler. Gemessen 2026-10-20: `provider: prompter`,
# `model: agnes-2.5-flash` — beide Provider zeigen auf den Agnes-Host,
# `prompter` liest `PROMPTER_API_KEY`, `agnes` liest `AGNES_API_KEY`.
#
# WAS GEPRÜFT WIRD, IST DIE FORM, NICHT DER NAME
# (`scripts/lib/model-route.mjs`, `scripts/gate/tests/model-route.test.mjs`):
# der Provider muss in diesem Patch definiert sein, das Modell in seinem
# Katalog stehen, und `apiKeyEnv` muss einen Namen nennen (nie einen Wert).
# Ein Modell-Literal im Test wäre beim nächsten Wechsel rot und würde die Zahl
# ändern statt die Frage. Hart bleibt nur: eine Route OHNE Schlüssel ist
# MISSING_CREDENTIAL — die deepseek-official-Route (dsh-llm-deepseek) ist
# gemountet, hat aber ohne DEEPSEEK_API_KEY keinen. Wer hier eine Route ohne
# gesetzte Variable einträgt, nimmt genau das in Kauf.
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      openrouter:
        apiKeyEnv: SHINON_API_KEY
        displayName: Shinon Forge
      nvidia:
        apiKeyEnv: NVIDIA_API_KEY
        displayName: Shinon Forge
      groq:
        apiKeyEnv: GROQ_API_KEY
        displayName: Shinon Forge
      cerebras:
        apiKeyEnv: CEREBRAS_API_KEY
        displayName: Shinon Forge
      google:
        apiKeyEnv: GOOGLE_API_KEY
        displayName: Shinon Forge
      mistral:
        apiKeyEnv: MISTRAL_API_KEY
        displayName: Shinon Forge
      together:
        apiKeyEnv: TOGETHER_API_KEY
        displayName: Shinon Forge
      huggingface:
        apiKeyEnv: HUGGINGFACE_API_KEY
        displayName: Shinon Forge
      agnes:
        displayName: Shinon Forge
        apiKeyEnv: AGNES_API_KEY
        api: openai-completions
        baseURL: https://apihub.agnes-ai.com/v1
        models:
          - id: agnes-2.5-flash
            name: Shinon 2.5 Flash
          - id: agnes-2.5-pro-alpha
            name: agnes-2.5-pro-alpha
          - id: agnes-video-2.5-flash
            name: agnes-video-2.5-flash
          - id: agnes-3.0-flash
            name: agnes-3.0-flash
          - id: agnes-image-2.1-flash
            name: agnes-image-2.1-flash
          - id: agnes-video-2.5
            name: agnes-video-2.5
          - id: agnes-image-2.0-flash
            name: agnes-image-2.0-flash
          - id: agnes-3.0-flash-max
            name: agnes-3.0-flash-max
          - id: agnes-2.5-pro
            name: agnes-2.5-pro
          - id: agnes-2.5-pro-beta
            name: agnes-2.5-pro-beta
          - id: agnes-image-2.5-flash
            name: agnes-image-2.5-flash
          - id: agnes-3.0-pro
            name: agnes-3.0-pro
      prompter:
        displayName: Shinon Forge
        apiKeyEnv: PROMPTER_API_KEY
        api: openai-completions
        baseURL: https://apihub.agnes-ai.com/v1
        models:
          - id: agnes-2.5-flash
            name: Shinon 2.5 Flash
          - id: agnes-2.5-pro-alpha
            name: agnes-2.5-pro-alpha
          - id: agnes-video-2.5-flash
            name: agnes-video-2.5-flash
          - id: agnes-3.0-flash
            name: agnes-3.0-flash
          - id: agnes-image-2.1-flash
            name: agnes-image-2.1-flash
          - id: agnes-video-2.5
            name: agnes-video-2.5
          - id: agnes-image-2.0-flash
            name: agnes-image-2.0-flash
          - id: agnes-3.0-pro
            name: agnes-3.0-pro
          - id: agnes-2.5-pro-beta
            name: agnes-2.5-pro-beta
          - id: agnes-image-2.5-flash
            name: agnes-image-2.5-flash
- id: agent-default-model
