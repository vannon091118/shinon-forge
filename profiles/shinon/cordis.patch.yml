# Shinon-Preset: EIGENE, schmalere Werkzeug-Zusammensetzung.
#
# Das DSH liefert vier Presets (standard, ptc, minimal, cordis). 'standard'
# ist der Werkzeug-Satz der DSH-Standards; Shinon faehrt ab hier seinen
# eigenen. Der Unterschied ist genau eine Stelle — die Terminal-Zeilen:
#
#   VORHER   tool-bash (2288 B) + tool-jobs (job_output 615 / job_list 168 /
#            job_kill 370) + die Section 'tool:jobs' (384 B)
#   NACHHER  persistent-shell-Gruppe: ein 'bash' (776 B) auf der PTY, ohne die
#            drei Job-Werkzeuge und ohne die Job-Section.
#
# GEMESSEN (Profilboot, node .cache/probe/measure-preset.mjs):
#   Tool-Anzahl    30 -> 27
#   Schema-Bytes 26465 -> 23797   (-2668 B, -10,1 %)
#   Section-Bytes 5168 -> 4692    (-476 B)
#
# Was der Tausch KOSTET (ehrlich benannt):
#   - Die Job-Steuerung (job_output/job_list/job_kill) und der Parameter
#     run_in_background entfallen. Ein dauerhaft laufender Befehl wird mit
#     'sleep 10 &' im persistenten Shell gestartet.
#   - Der Parameter sandbox_permissions (Eskalation der Dateisandbox aus dem
#     Tool heraus) entfaellt. Die Sandbox selbst bleibt: terminal-bash
#     injiziert sandboxPolicy und schliesst den Aufruf ueber ctx.sandbox ein
#     (dsh-terminal-bash/lib/index.js:906-969). Das Weitern der Sandbox
#     bleibt eine Sache des Menschen (Permission-Preset).
#   - workdir und timeoutMs je Aufruf entfallen als Parameter; das
#     Arbeitsverzeichnis bleibt ueber working_directory erreichbar.
#
# Die Gruppe ist dieselbe, die das DSH im eigenen Preset 'minimal' verwendet
# (node_modules/@deepseek-ai/dsh/node_modules/@deepseek-ai/dsh-web-app/
# presets/minimal.patch.yml): persistent-shell mit isolate: terminals,
# dsh-terminal + dsh-terminal-bash + dsh-tool-bash-persistent.
#
# PLATTFORM: Diese Datei nennt keine !!js-Ausdruecke, weil das statische Gate
# sie mit js-yaml liest (scripts/lib/yaml.mjs) und ein unbekanntes Tag dort
# ein ungueltiges YAML ist. Die Bash-Zeilen sind deshalb fest eingeschaltet
# und die pwsh-Zeile fest ausgeschaltet — fuer die Plattform, auf der dieses
# Repo laeuft (Linux: AppImage, deb, systemd-Units).
#
# OFFENE LUECKE, die der Nutzer kennen muss: der Windows-Weg
# (scripts/win-build.mjs, CI-Bauhost windows-latest) bepackt DIESELBE Datei
# (scripts/lib/payload.mjs:67). Dort bietet das Preset also bash ohne pwsh —
# das DSH-Standard-Preset tauscht es umgekehrt. Wer Windows braucht, muss
# die pwsh-Zeile aktivieren und die Bash-Zeilen deaktivieren; eine
# Plattformbedingung kann diese Datei nicht tragen, weil der Gate-Parser
# kein !!js kennt. Der Nachweis des Windows-Betriebs steht ohnehin noch aus
# (docs/ROADMAP.md:69).
- insert:
    - id: preset-shinon
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: shinon
        order: 0
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a coding agent powered by the {{model}} model.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: persistent-shell
            name: cordis:group
            group: true
            isolate:
              terminals: true
            config:
              - id: pty
                name: '@deepseek-ai/dsh-terminal'
              - id: terminal-bash
                name: '@deepseek-ai/dsh-terminal-bash'
                config:
                  timeoutMs: 300000
              - id: persistent-bash
                name: '@deepseek-ai/dsh-tool-bash-persistent'
                config:
                  timeoutMs: 300000
                  description: |-
                    Run commands in a bash shell
                    * The contents of the "command" parameter do NOT need to be XML-escaped.
                    * State is persistent across command calls: the working directory and the
                      environment carry over from one call to the next.
                    * Long output is truncated; the full output is saved to a file whose path
                      is reported. To inspect a line range of a file, e.g. lines 10-25, try
                      'sed -n 10,25p /path/to/the/file'.
                    * Please avoid commands that may produce a very large amount of output.
                    * Please run long lived commands in the background, e.g. 'sleep 10 &'.
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: true
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
            disabled: true
# Der Preset, den eine NEUE Sitzung startet.
#
# DIESE Zeile ist KEIN Verweis auf ein ungeladenes Paket: sie ist ein
# id-zielender Override der Zeile, die das Bundle @deepseek-ai/dsh-web-app
# selbst einfuegt (dsh-web-app/presets/cordis.patch.yml). Das 'name' ist
# dabei die GUARD der Patch-Semantik: passt es nicht zum Ziel, verwirft der
# Loader den Patch (gemessen: "patch: name mismatch for
# agent-preset-registry"). Das Paket selbst liegt verschachtelt unter
# node_modules/@deepseek-ai/dsh/node_modules/ und laedt ueber den
# Bundle-Kontext.
#
# selectedDefault gehoert dem Nutzer: das UI schreibt es ueber den
# settings-Dienst in genau diese Datei (volatile). Deshalb steht hier nur
# das 'default' — der Wert, den die DEPLOYMENT-Vorgabe bestimmt. Ein
# stehengebliebenes selectedDefault wuerde die Nutzerwahl ueberstimmen
# (gemessen: defaultId = selectedDefault.get() ?? default).
- id: agent-preset-registry
  name: "@deepseek-ai/dsh-agent-preset-registry"
  config:
    default: shinon
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: verbose
# Permission-Default (C7): `workspace-write` mit `approval: ask` — kein stiller
# Vollzugriff im Startzustand. `danger-full-access` (approval: never) bleibt als
# benannter Preset waehlbar, wird aber nicht mehr vorausgewaehlt: ein Nutzer, der
# ihn will, waehlt ihn bewusst.
- id: permission
  name: "@deepseek-ai/dsh-permission-presets"
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: workspace-write

# Narrative Engine (Zug 5): AKTIV. Bis dahin stand `inactive: true` im Manifest —
# gebaut, aber nicht geladen. Mit der Aktivierung ist der eigene Schema-Fallback
# weg (das Paket bindet Schemastery wie jedes andere), die XorShift-PRNG ist weg
# (Mood und Erzaehler kommen aus dem Vertrag), die Uhr ist weg (ein fehlendes
# `timestamp` bleibt leer) und der tote `ctx.set`-Dienst ist weg (niemand las ihn;
# der Composite geht als Ereignis `shinon/narrative/state` hinaus).
#
# Die wirksamen Grenzen stehen hier, nicht im Paket (dort nur Schema-Defaults):
# chronicleLimit 50 = die letzten 50 Ereignisse sind der heisse Faden,
# freezeThreshold 20 = nach 20 Takten wechselt der Arc benannt und der alte wird
# archiviert. Der rote Faden reisst nicht, er wechselt an einer Schwelle.
- id: shinon-narrative
  config:
    eventsChannel: shinon/event
    chronicleLimit: 50
    freezeThreshold: 20
    relationshipWindow: 20

# Persona (Zug 1-8): Die IDENTITAET spricht in jeder Sitzung dieses Deployments
# (`identityScope: global`) und wird beim Boot nicht neu geschrieben. Projekt-
# Kontext, projektspezifische Erinnerungen und der Selbstmodell-Stand bleiben
# am Workspace; das Langzeitgedaechtnis liegt in der Ablage des Project Index
# (shinon.persona-memory/v1), nie in Projektdateien. `workspace` waere die alte,
# engere Vorgabe — hier ist die weitere bewusst gewaehlt.
- id: shinon-persona
  config:
    identityScope: global
    projectContextPath: .shinon/project-context.md

# Prompter (Zug 6) — das Bindeglied. Er ist der EINE Punkt im Schritt, an dem
# Nutzereingabe, Scoring (Ton/Haltung), Project Index (MAX-Kontext) und die
# Skills des Projekts zusammenlaufen, bevor der Schritt ans Modell geht.
#
# WARUM HIER ALLE WERTE STEHEN UND NICHT IM PAKET: eine id-gezielte Config in
# DIESER Ebene ERSETZT die Config des Bundle-Eintrags — sie mischt nicht. Genau
# das war der Fehler bis 2026-10-13: hier stand nur `skillsPath`, und damit war
# `mode: MAX` samt Route aus `packages/prompter/cordis.patch.yml` weg. Der
# Prompter mountete mit Schema-Defaults (MIN, leere Route), meldete `NO_ROUTE`
# und veredelte NIE etwas — sichtbar nur als „der Enhancer ist inaktiv“ im
# Trace-Panel. Der Fix in 0551c7f (contextPath) war deshalb richtig und
# wirkungslos: er stand in der Ebene, die ueberschrieben wird.
#
# Deshalb gilt hier die Repo-Regel in ihrer scharfen Form: WIRKSAME WERTE STEHEN
# IM PROFIL, das Paket traegt nur den Insert. Eine Config in beiden Ebenen ist
# verboten und wird von `scripts/gate/tests/profile-config-override.test.mjs`
# abgelehnt — nicht nur fuer den Prompter, sondern fuer jede id.
#
# mode: MAX fragt den Project Index zur Laufzeit (shinon_index_query). `contextPath`
# bleibt ABSICHTLICH leer: max-context.json war ein unbrauchbarer Platzhalter, und
# eine ausdruecklich gesetzte, kaputte Datei sperrt MAX fail-closed VOR der
# Index-Abfrage.
#
# DIE ROUTE IST EINE ENTSCHEIDUNG MIT PREIS: pro Nutzer-Schritt faellt ein
# zusaetzlicher Modellaufruf an (One-Shot-Child, ohne Tools). Ohne Route gibt es
# keinen Aufruf — dann meldet der Enhancer `NO_ROUTE` und der Roh-Prompt gilt.
#
# Die Skills liegen im PROJEKT (.agents/skills/), nicht im Tarball. Leer heisst:
# keine Skills laden (fail-open).
- id: shinon-prompter
  config:
    observeEvents: [ 'agent/pre-step' ]
    mode: MAX
    # One-Shot-Route (Phase 5): EIGENER Provider mit eigenem Schlüssel
    # (PROMPTER_API_KEY, `prompter`-Block in llm-pi-ai oben). Fehlt die
    # Variable, faellt der Host beim Mounten auf `agnes` zurück — der Enhancer
    # bleibt damit lauffähig, auch ohne eigenen Schlüssel. Die Haupt-Route
    # (`agent-default-model`) schreibt dieses Paket NIE: sie ist die Wahl des
    # Nutzers (Config-Editor), und der Enhancer liest sie nicht einmal.
    provider: prompter
    model: agnes-2.5-flash
    providerKeyEnv: PROMPTER_API_KEY
    # Skill-Lebenszyklus (Zug 7): Korrekturen und abgeschlossene Zuege erzeugen
    # Kandidaten; veroeffentlicht wird nach .agents/skills, dem Root, den DSH nativ
    # entdeckt. Der Vorgabewert im Paket ist AUS; die Entscheidung steht hier.
    skillLifecycle: true
    providerFallback: agnes
    modelFallback: agnes-2.5-flash
    skillsPath: .agents/skills
    indexBudgetTokens: 6000
    maxTokens: 0 # 0 = kein Limit (unbegrenzte Thinking-Tokens des One-Shots)
    temperature: 0.3
    timeoutMs: 15000
    trace: true
    # Gelernte Bausteine (Phase 4): Projekt-Ablage über der Paket-Registry.
    blocksLearnedPath: .shinon/blocks.learned.json
    # Der MAX-Kontext kommt aus dem Project Index (Dienst shinon_index_query).
    # Einen zweiten, eigenen Index gibt es nicht mehr.
    # Intent-Patterns (Zug 8): Trigger → Full-Task-Expansion, default im Paket.
    # Fassung 2: 40 granulare Patterns + Merkmale (mehrschritt/ziel/pfad/code).
    intentPatternsPath: ./assets/intent-rules.json
    # Intent-Gedächtnis: Zählung über ALLE Läufe (Treffer, Klassen, Merkmale,
    # Laufzeit, Folge-Rückmeldung) und daraus der gelernte Gewichtsfaktor je
    # Pattern. Relativ zum WORKSPACE — Projektwissen, kein Tarball-Inhalt.
    intentMemoryPath: .shinon/intent-memory.json

# Popup (Zug 6): das Fortschritts-Overlay ueber dem Eingabefeld.
#
# Der Datenweg ist der Grund, warum dieses Paket lange inaktiv war: ein
# Out-of-Tree-Bundle kann KEINEN Host-Endpunkt registrieren (die Remote-Beitraege
# der Browser-Haelfte sind eine kompilierte Liste in @deepseek-ai/dsh-api-remotes),
# und die Connection-Naht ist reines Anfrage/Antwort ohne Abo. Die Client-Haelfte
# liest deshalb — wie @shinon/token-usage — die SITZUNG: `uiSession.adapter.current`
# nennt die gezeigte Sitzung, `sessions.binding(id).eventSource` traegt das
# Ereignisfenster, und dessen Ereignisse faltet sie selbst (Faltung + Lesart:
# packages/popup/assets/trajectory-core.js, bytegleich gespiegelt).
#
# slotName ist die EINE Angabe, die nicht frei ist: die Client-Haelfte traegt den
# Slot als Literal (sie kann den Host nicht importieren). Der Gate-Test
# `scripts/gate/tests/popup-overlay.test.mjs` vergleicht die wirksamen Werte hier
# mit dem Literal der Haelfte — ein anderer Slot hier wird rot, statt still ins
# Leere zu rendern.
#
# PROBE-API, keine Ende-zu-Ende-Funktion: der Host emittiert auf
# `shinon/trajectory`, aber in diesem Baum konsumiert kein Paket den Kanal.
# Das sichtbare Overlay faltet stattdessen das Sitzungsfenster direkt. Der
# Gate-Test `scripts/gate/tests/popup-overlay.test.mjs` pinnt diese Grenze und
# verbietet eine Ende-zu-Ende-Behauptung fuer diesen Kanal.
- id: shinon-popup
  config:
    enabled: true
    slotName: 'conversation.composer.dock'
    trigger: 'user/message'
    showOriginal: true
    showOutput: true
    showProcess: true
    category: 'process-step'
    color: '#ff8800'
    trajectoryChannel: 'shinon/trajectory'
    # ^ Die Kanäle sind EIGENE Namen dieses Pakets und keine zweite
    #   Spine-Wahrheit: den Spine-Kanal (`shinon/event`) liest @shinon/narrative.

    # Key-Router (Zug 6): der Schlüssel-Pool der Modell-Route.
    #
    # DIE ENTSCHEIDUNG IST DER NAME, NICHT DER WERT: `envNames: [ 'AGNES_API_KEY' ]`
    # nennt die Umgebungsvariable, die die Route ohnehin liest (der `agnes`-Block
    # oben, `apiKeyEnv`). Das Schema dieses Pakets hat KEIN Feld für einen
    # Schlüsselwert, und es darf keines bekommen: eine Profildatei ist versioniert.
    # Vorher stand hier `providers[].pool: []` und `defaultKey: ''` — zwei Felder, die
    # einen Schlüssel aufgenommen hätten. Beide sind entfernt.
    #
    # baseUrl wird GESPIEGELT, nicht erfunden: der Verbindungstest fragt die
    # Modellliste ab und muss denselben Host fragen wie die Route. Der Gate-Test
    # `scripts/gate/tests/key-router-security.test.mjs` vergleicht beide Werte — ein
    # anderer Host hier waere ein zweiter Wahrheitsstand ueber denselben Anbieter.
    #
    # initialDelayMs/maxDelayMs/maxRetries sind die Eskalation bei 429: der erste
    # Fehlschlag wartet 2 s, jeder weitere verdoppelt, gedeckelt bei 60 s, mit
    # ±25 % Jitter (assets/pool-core.js; nachgerechnet in packages/key-router/test/).
    #
    # Der Provider-Override ist implementiert: fuer diese envNames klammert
    # key-router credentials.resolve und bedient die Route aus dem Pool; nach
    # RATE_LIMIT wird der verwendete Platz gedeckelt. Tests belegen die Kette bis
    # zum Loopback-Draht. Nicht live belegt ist eine 429-Rotation beim echten
    # Anbieter mit echten Schluesseln (docs/ZAHLEN.md §4).

- id: shinon-key-router
  config:
    providers:
      - id: agnes
        envNames: [ 'AGNES_API_KEY' ]
        baseUrl: https://apihub.agnes-ai.com/v1
        protocol: openai-compatible
        probePath: /models
        initialDelayMs: 2000
        maxDelayMs: 60000
        maxRetries: 5
      # Zweite Plätze für die One-Shot-Route (Phase 5): derselbe Host, eigener
      # Umgebungsname. Der Router meldet Pool-Status für BEIDE Routen; baseUrl
      # muss zur Route `prompter` passen (key-router-security pinnt das).
      - id: prompter
        envNames: [ 'PROMPTER_API_KEY' ]
        baseUrl: https://apihub.agnes-ai.com/v1
        protocol: openai-compatible
        probePath: /models
        initialDelayMs: 2000
        maxDelayMs: 60000
        maxRetries: 5

# Traceability (LS-Popup-Toasts): fluechtige Meldungen unten rechts im Chat.
#
# DIE WIRTSCHAFT DIESES EINTRAGS: er liefert die Grenzen an die Browser-Haelfte,
# mehr tut der Host nicht. Die Haelfte foldet das SITZUNGSSFENSTER selbst
# (uiSession → sessions.binding → eventSource), exakt wie @shinon/popup — ein
# Host-Listener auf `tool/call`/`tool/result`/`step/start`/`agent/error` waere
# tot, weil das Record-Typen des Session-Logs und keine Bus-Events sind
# (belegt an session.v4.jsonl: 199x tool/call, 0 emits in DSH-Libs).
#
# Der Weg zu den Grenzen ist `webserver/index-inject` als
# `window.__SHINON_TRACEABILITY_CONFIG__` — dieselbe Naht, ueber die
# @shinon/markers seine Grenzen ausliefert. Der fruehere Versuch schrieb in
# `globalThis.window` zur Laufzeit und verfiel am Node-Host still.
- id: shinon-traceability
  config:
    enabled: true
    maxVisible: 3
    duration: 4000
