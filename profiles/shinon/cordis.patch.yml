# Shinon Forge - the canonical `shinon` profile.
#
# `dsh.profile.bundles` in package.json activates the currently supported
# Shinon Forge plugins; each bundle contributes its own patch layer below.
# OpenAPI is deliberately inactive, not accidentally broken: @shinon/openapi
# is neither a bundle nor a dependency of this profile.
#
# This user layer is applied after every bundle layer - a top-level YAML array
# of loader patch entries (id-targeted config overrides, disables, and insert
# lists; `!!js` expressions allowed).

# Route des Prompt-Enhancers. Der wirksame Wert gehoert hierher, nicht ins
# Paket: das Paket haelt nur Schema-Defaults (dort ist die Route leer, damit ein
# kopiertes Paket nichts still kostet). Hier zeigt sie auf dieselbe Route wie
# der Default des Agenten — agnes/agnes-2.5-flash, ohne Nutzungslimits.
# Wirkung: pro Nutzer-Schritt ein zusaetzlicher Modellaufruf des One-Shots;
# faellt er aus, gilt unveraendert der Roh-Prompt.
#
# indexBudgetTokens: das Budget des MAX-Kontexts aus dem Projektindex.
# MAX braucht Projektkenntnis; die kommt jetzt aus ZWEI moeglichen Quellen:
# einer Kontextdatei (contextPath, ausdrueckliche Angabe, gewinnt) oder dem
# Index ueber `ctx.get('shinon_index_query')` — ohne Injektionszwang, damit
# dieser Enhancer auch in einem Profil ohne Project Index laedt.
# Der wirksame Wert steht hier und nicht im Paket (dort nur der Schema-Default),
# und `mode` bleibt MIN: der Index macht MAX moeglich, er schaltet es nicht ein.
- id: shinon-prompter
  config:
    provider: agnes
    model: agnes-2.5-flash
    indexBudgetTokens: 6000

# Task Router (Plan §16/§17): die SCHWELLE und die STOP-POLICY sind
# Entscheidungen, keine Konstanten im Code. Deshalb stehen die wirksamen Werte
# hier und nicht im Paket, wo nur die Schema-Defaults liegen.
#
# threshold=2: MULTI_STEP_TASK (2) und LONG_RUNNING_GOAL (3) sind
# Goal-Kandidaten, CHAT/LOOKUP/TRANSFORM (0) nie.
# minRawLength=24: die Substanzgrenze — ein Zweiwortsatz, den das Modell fuer
# einen Mehrschritt-Auftrag haelt, wird zurueckgestuft. Die einzige
# deterministische Tatsache der Entscheidung, die nicht vom Modell kommt.
#
# activate=true ist die Aktivierungsentscheidung aus §17 (Shinon) und die
# bewussteste Zeile in dieser Datei: ein Kandidat erzeugt dann ein echtes
# DSH-Goal (ctx.goals), das DSHs Round-Driver bis zur Obergrenze fortsetzt —
# pro Runde ein vollstaendiger Agentenschritt mit Modellaufrufen. maxGoalRounds
# ist deshalb SHINONS Stop-Policy: DSH selbst erlaubt 256 Runden
# (defaultMaxGoalRounds). Zum Abschalten genuegt `activate: false`.
# Ein bereits bestehendes Goal wird NIE automatisch ueberschrieben.
- id: shinon-task-router
  config:
    threshold: 2
    minRawLength: 24
    activate: true
    maxGoalRounds: 6

# @shinon/core owns the sidebar brand. 'sidebar.brand.mark' and
# 'sidebar.brand.name' are single slots (exactly one occupant), so the shipped
# official brand has to yield.
- id: ui-brand-official
  disabled: true
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1

# Modell-Route über den pi-ai-Adapter. `apiKeyEnv` ist nur ein REFERENZNAME:
# das Secret kommt aus der Umgebung (SHINON_API_KEY), nie aus dieser Datei.
# Ohne gesetzte Variable bleibt die Route konfiguriert-aber-schlüssellos.
#
# WICHTIG: `agent-default-model` MUSS auf eine Route mit Key zeigen. Die
# deepseek-official-Route (dsh-llm-deepseek) ist im Web-Profil gemountet, hat
# aber ohne DEEPSEEK_API_KEY keinen Schlüssel → MISSING_CREDENTIAL. Deshalb
# zeigt der Default auf openrouter; die Modellwahl in der UI darf ihn
# überschreiben, aber der Startzustand muss funktionieren.
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      # KATALOG-ROUTEN: kein `models:` setzen!
      # Laut Adapter-README ERSETZT ein `models:`-Block den Katalog der Route
      # vollstaendig ("Replaces the route's catalog wholesale"). Genau daran hing
      # der Befund, dass die Modellwahl nur ein einziges Modell anbot: hier stand
      # zuvor ein models-Eintrag fuer openrouter und damit der ganze Katalog weg.
      # Ohne models-Liste liefert der installierte pi-ai-Katalog alle Modelle der
      # Route; die Models-Seite kann zusaetzlich live ueber GET {baseURL}/models
      # nachfragen.
      openrouter:
        apiKeyEnv: SHINON_API_KEY
        displayName: Shinon Forge
      # --- Free-Tier-Anbieter, alle als Katalog-Route vorhanden ---
      nvidia:
        apiKeyEnv: NVIDIA_API_KEY
        displayName: Shinon Forge
      groq:
        apiKeyEnv: GROQ_API_KEY
        displayName: Shinon Forge
      cerebras:
        apiKeyEnv: CEREBRAS_API_KEY
        displayName: Shinon Forge
      google:
        apiKeyEnv: GOOGLE_API_KEY
        displayName: Shinon Forge
      mistral:
        apiKeyEnv: MISTRAL_API_KEY
        displayName: Shinon Forge
      together:
        apiKeyEnv: TOGETHER_API_KEY
        displayName: Shinon Forge
      huggingface:
        apiKeyEnv: HUGGINGFACE_API_KEY
        displayName: Shinon Forge
      # Agnes AI (Sapiens AI) — NICHT im pi-ai-Katalog, deshalb als eigene Route
      # deklariert: api + baseURL + nicht-leere models-Liste sind hier Pflicht,
      # sonst wird das Profil beim Schreiben abgelehnt.
      # `contextWindow` bewusst weggelassen: unbekannt, es gilt der dokumentierte
      # Default des Adapters.
      agnes:
        displayName: Shinon Forge
        apiKeyEnv: AGNES_API_KEY
        api: openai-completions
        baseURL: https://apihub.agnes-ai.com/v1
        models:
          - id: agnes-2.5-flash
            name: Agnes 2.5 Flash
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: agnes
    model: agnes-2.5-flash
- id: agent-preset-registry
  name: "@deepseek-ai/dsh-agent-preset-registry"
  config:
    default: standard
    selectedDefault: cordis
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: verbose
