# Shinon Forge - the canonical `shinon` profile.
#
# `dsh.profile.bundles` in package.json activates the currently supported
# Shinon Forge plugins; each bundle contributes its own patch layer below.
# OpenAPI is deliberately inactive, not accidentally broken: @shinon/openapi
# is neither a bundle nor a dependency of this profile.
#
# This user layer is applied after every bundle layer - a top-level YAML array
# of loader patch entries (id-targeted config overrides, disables, and insert
# lists; `!!js` expressions allowed).

# Task Router (Plan §16/§17): die SCHWELLE und die STOP-POLICY sind
# Entscheidungen, keine Konstanten im Code. Deshalb stehen die wirksamen Werte
# hier und nicht im Paket, wo nur die Schema-Defaults liegen.
#
# threshold=2: MULTI_STEP_TASK (2) und LONG_RUNNING_GOAL (3) sind
# Goal-Kandidaten, CHAT/LOOKUP/TRANSFORM (0) nie.
# minRawLength=24: die Substanzgrenze — ein Zweiwortsatz, den das Modell fuer
# einen Mehrschritt-Auftrag haelt, wird zurueckgestuft. Die einzige
# deterministische Tatsache der Entscheidung, die nicht vom Modell kommt.
#
# activate=false ist die Entscheidung C7 ("sicherer Start bis H5"): der Router
# BEURTEILT weiterhin jede Eingabe (threshold und minRawLength gelten unveraendert)
# und meldet seine Entscheidung — er erzeugt aber KEIN echtes DSH-Goal
# (ctx.goals), und damit keine vom Round-Driver fortgesetzten Runden mit
# vollstaendigen Agentenschritten und Modellaufrufen. Wie viel das wert ist,
# entscheidet H5 (4.6) an Messdaten, nicht an Meinung.
# Zum Anschalten genuegt `activate: true`; die Faehigkeit ist gebaut und getestet
# (docs/probes/task-router.json, docs/probes/goal-micro-state.json).
# maxGoalRounds ist dann SHINONS Stop-Policy: DSH selbst erlaubt 256 Runden
# (defaultMaxGoalRounds). Ein bereits bestehendes Goal wird NIE ueberschrieben.
- id: shinon-task-router
  config:
    threshold: 2
    minRawLength: 24
    activate: false
    maxGoalRounds: 6

# Project Index. `verify` steht hier, weil es eine ENTSCHEIDUNG ist und keine
# Konstante: der wirksame Wert gehoert ins Profil, das Paket haelt nur den
# Schema-Default.
#
# stamp — Shinons Umgang mit der Luecke aus §11: Groesse und mtime werden nicht
# allein geglaubt. Stimmen beide, entscheidet zusaetzlich der Inode-Stempel
# (Geraet, Inode, Groesse, mtime, ctime). Gemessen an diesem Repo (181 Dateien,
# 1,19 MiB): stiller Lauf 0 Bytes gelesen wie 'changed' (58,6 gegen 58,7 ms
# Median, verschraenkt gemessen — der eine stat mehr je Datei ist hier nicht
# messbar), waehrend 'all' JEDEN Lauf 1,2 MB liest (100 ms). Die Luecke —
# gleiche Groesse, zurueckgesetzte mtime — wird 6 von 6 erkannt und kostet
# 24,9 KB (2% des Baums), 'changed' erkennt 0 von 6. Ein Werkzeug, das nur die
# METADATEN des ganzen Baums anfasst, kostet EINEN Vollauf (99%), danach ist es
# wieder still: der Stempel wird mit aufgefrischt.
# 'all' bleibt die Politik, die nichts annimmt — und jeden Lauf alles liest.
- id: shinon-project-index
  config:
    verify: stamp

# @shinon/core owns the sidebar brand. 'sidebar.brand.mark' and
# 'sidebar.brand.name' are single slots (exactly one occupant), so the shipped
# official brand has to yield.
- id: ui-brand-official
  disabled: true
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1

# Modell-Route über den pi-ai-Adapter. `apiKeyEnv` ist nur ein REFERENZNAME:
# das Secret kommt aus der Umgebung (SHINON_API_KEY), nie aus dieser Datei.
# Ohne gesetzte Variable bleibt die Route konfiguriert-aber-schlüssellos.
#
# WICHTIG: `agent-default-model` MUSS auf eine Route mit Key zeigen. Die
# deepseek-official-Route (dsh-llm-deepseek) ist gemountet, hat aber ohne
# DEEPSEEK_API_KEY keinen Schlüssel → MISSING_CREDENTIAL. Deshalb zeigt der
# Default auf die Route, die die Entscheidung A8 festgelegt hat:
# agnes/agnes-2.5-flash (apiKeyEnv AGNES_API_KEY, api openai-completions, baseURL
# unten in der llm-pi-ai-Route). Die Modellwahl in der UI darf ihn überschreiben,
# aber der Startzustand muss funktionieren.
#
# Diese Zeile und der Kommentar oben nennen DIESELBE Route (C8); wer sie ändert,
# ändert beide — sonst widersprechen sich Kommentar und Config.
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      openrouter:
        apiKeyEnv: SHINON_API_KEY
        displayName: Shinon Forge
      nvidia:
        apiKeyEnv: NVIDIA_API_KEY
        displayName: Shinon Forge
      groq:
        apiKeyEnv: GROQ_API_KEY
        displayName: Shinon Forge
      cerebras:
        apiKeyEnv: CEREBRAS_API_KEY
        displayName: Shinon Forge
      google:
        apiKeyEnv: GOOGLE_API_KEY
        displayName: Shinon Forge
      mistral:
        apiKeyEnv: MISTRAL_API_KEY
        displayName: Shinon Forge
      together:
        apiKeyEnv: TOGETHER_API_KEY
        displayName: Shinon Forge
      huggingface:
        apiKeyEnv: HUGGINGFACE_API_KEY
        displayName: Shinon Forge
      agnes:
        displayName: Shinon Forge
        apiKeyEnv: AGNES_API_KEY
        api: openai-completions
        baseURL: https://apihub.agnes-ai.com/v1
        models:
          - id: agnes-2.5-flash
            name: Shinon 2.5 Flash
          - id: agnes-2.5-pro-alpha
            name: agnes-2.5-pro-alpha
          - id: agnes-video-2.5-flash
            name: agnes-video-2.5-flash
          - id: agnes-3.0-flash
            name: agnes-3.0-flash
          - id: agnes-image-2.1-flash
            name: agnes-image-2.1-flash
          - id: agnes-video-2.5
            name: agnes-video-2.5
          - id: agnes-image-2.0-flash
            name: agnes-image-2.0-flash
          - id: agnes-3.0-flash-max
            name: agnes-3.0-flash-max
          - id: agnes-2.5-pro
            name: agnes-2.5-pro
          - id: agnes-2.5-pro-beta
            name: agnes-2.5-pro-beta
          - id: agnes-image-2.5-flash
            name: agnes-image-2.5-flash
          - id: agnes-3.0-pro
            name: agnes-3.0-pro
      prompter:
        displayName: Shinon Forge
        apiKeyEnv: PROMPTER_API_KEY
        api: openai-completions
        baseURL: https://apihub.agnes-ai.com/v1
        models:
          - id: agnes-2.5-flash
            name: Shinon 2.5 Flash
          - id: agnes-2.5-pro-alpha
            name: agnes-2.5-pro-alpha
          - id: agnes-video-2.5-flash
            name: agnes-video-2.5-flash
          - id: agnes-3.0-flash
            name: agnes-3.0-flash
          - id: agnes-image-2.1-flash
            name: agnes-image-2.1-flash
          - id: agnes-video-2.5
            name: agnes-video-2.5
          - id: agnes-image-2.0-flash
            name: agnes-image-2.0-flash
          - id: agnes-3.0-pro
            name: agnes-3.0-pro
          - id: agnes-2.5-pro-beta
            name: agnes-2.5-pro-beta
          - id: agnes-image-2.5-flash
            name: agnes-image-2.5-flash
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: agnes
    model: agnes-2.5-flash
- id: agent-preset-registry
  name: "@deepseek-ai/dsh-agent-preset-registry"
  config:
    default: standard
    selectedDefault: standard
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: verbose
# Permission-Default (C7): `workspace-write` mit `approval: ask` — kein stiller
# Vollzugriff im Startzustand. `danger-full-access` (approval: never) bleibt als
# benannter Preset waehlbar, wird aber nicht mehr vorausgewaehlt: ein Nutzer, der
# ihn will, waehlt ihn bewusst.
- id: permission
  name: "@deepseek-ai/dsh-permission-presets"
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: workspace-write

# Narrative Engine (Zug 5): AKTIV. Bis dahin stand `inactive: true` im Manifest —
# gebaut, aber nicht geladen. Mit der Aktivierung ist der eigene Schema-Fallback
# weg (das Paket bindet Schemastery wie jedes andere), die XorShift-PRNG ist weg
# (Mood und Erzaehler kommen aus dem Vertrag), die Uhr ist weg (ein fehlendes
# `timestamp` bleibt leer) und der tote `ctx.set`-Dienst ist weg (niemand las ihn;
# der Composite geht als Ereignis `shinon/narrative/state` hinaus).
#
# Die wirksamen Grenzen stehen hier, nicht im Paket (dort nur Schema-Defaults):
# chronicleLimit 50 = die letzten 50 Ereignisse sind der heisse Faden,
# freezeThreshold 20 = nach 20 Takten wechselt der Arc benannt und der alte wird
# archiviert. Der rote Faden reisst nicht, er wechselt an einer Schwelle.
- id: shinon-narrative
  config:
    eventsChannel: shinon/event
    chronicleLimit: 50
    freezeThreshold: 20
    relationshipWindow: 20

# Persona (Zug 1-5): Nur im Shinon-Projekt aktiv — der Check sitzt in apply().
# Projekt-Kontext wird aus .shinon/project-context.md geladen (falls vorhanden).
# Leer bleibt = kein Projektkontext (fail-open).
- id: shinon-persona
  config:
    projectContextPath: .shinon/project-context.md

# Prompter (Zug 6) — das Bindeglied. Er ist der EINE Punkt im Schritt, an dem
# Nutzereingabe, Scoring (Ton/Haltung), Project Index (MAX-Kontext) und die
# Skills des Projekts zusammenlaufen, bevor der Schritt ans Modell geht.
#
# WARUM HIER ALLE WERTE STEHEN UND NICHT IM PAKET: eine id-gezielte Config in
# DIESER Ebene ERSETZT die Config des Bundle-Eintrags — sie mischt nicht. Genau
# das war der Fehler bis 2026-10-13: hier stand nur `skillsPath`, und damit war
# `mode: MAX` samt Route aus `packages/prompter/cordis.patch.yml` weg. Der
# Prompter mountete mit Schema-Defaults (MIN, leere Route), meldete `NO_ROUTE`
# und veredelte NIE etwas — sichtbar nur als „der Enhancer ist inaktiv“ im
# Trace-Panel. Der Fix in 0551c7f (contextPath) war deshalb richtig und
# wirkungslos: er stand in der Ebene, die ueberschrieben wird.
#
# Deshalb gilt hier die Repo-Regel in ihrer scharfen Form: WIRKSAME WERTE STEHEN
# IM PROFIL, das Paket traegt nur den Insert. Eine Config in beiden Ebenen ist
# verboten und wird von `scripts/gate/tests/profile-config-override.test.mjs`
# abgelehnt — nicht nur fuer den Prompter, sondern fuer jede id.
#
# mode: MAX fragt den Project Index zur Laufzeit (shinon_index_query). `contextPath`
# bleibt ABSICHTLICH leer: max-context.json war ein unbrauchbarer Platzhalter, und
# eine ausdruecklich gesetzte, kaputte Datei sperrt MAX fail-closed VOR der
# Index-Abfrage.
#
# DIE ROUTE IST EINE ENTSCHEIDUNG MIT PREIS: pro Nutzer-Schritt faellt ein
# zusaetzlicher Modellaufruf an (One-Shot-Child, ohne Tools). Ohne Route gibt es
# keinen Aufruf — dann meldet der Enhancer `NO_ROUTE` und der Roh-Prompt gilt.
#
# Die Skills liegen im PROJEKT (.agents/skills/), nicht im Tarball. Leer heisst:
# keine Skills laden (fail-open).
- id: shinon-prompter
  config:
    observeEvents: [ 'agent/pre-step' ]
    mode: MAX
    # One-Shot-Route (Phase 5): EIGENER Provider mit eigenem Schlüssel
    # (PROMPTER_API_KEY, `prompter`-Block in llm-pi-ai oben). Fehlt die
    # Variable, faellt der Host beim Mounten auf `agnes` zurück — der Enhancer
    # bleibt damit lauffähig, auch ohne eigenen Schlüssel. Die Haupt-Route
    # (`agent-default-model`) bleibt unberührt bei agnes.
    provider: prompter
    model: agnes-2.5-flash
    providerKeyEnv: PROMPTER_API_KEY
    providerFallback: agnes
    modelFallback: agnes-2.5-flash
    skillsPath: .agents/skills
    indexBudgetTokens: 6000
    maxTokens: 0 # 0 = kein Limit (unbegrenzte Thinking-Tokens des One-Shots)
    temperature: 0.3
    timeoutMs: 15000
    trace: true
    # Gelernte Bausteine (Phase 4): Projekt-Ablage über der Paket-Registry.
    blocksLearnedPath: .shinon/blocks.learned.json
    # Der MAX-Kontext kommt aus dem Project Index (Dienst shinon_index_query).
    # Einen zweiten, eigenen Index gibt es nicht mehr.
    # Intent-Patterns (Zug 8): Trigger → Full-Task-Expansion, default im Paket.
    intentPatternsPath: ./assets/intent-rules.json

# Popup (Zug 6): das Fortschritts-Overlay ueber dem Eingabefeld.
#
# Der Datenweg ist der Grund, warum dieses Paket lange inaktiv war: ein
# Out-of-Tree-Bundle kann KEINEN Host-Endpunkt registrieren (die Remote-Beitraege
# der Browser-Haelfte sind eine kompilierte Liste in @deepseek-ai/dsh-api-remotes),
# und die Connection-Naht ist reines Anfrage/Antwort ohne Abo. Die Client-Haelfte
# liest deshalb — wie @shinon/token-usage — die SITZUNG: `uiSession.adapter.current`
# nennt die gezeigte Sitzung, `sessions.binding(id).eventSource` traegt das
# Ereignisfenster, und dessen Ereignisse faltet sie selbst (Faltung + Lesart:
# packages/popup/assets/trajectory-core.js, bytegleich gespiegelt).
#
# slotName ist die EINE Angabe, die nicht frei ist: die Client-Haelfte traegt den
# Slot als Literal (sie kann den Host nicht importieren). Der Gate-Test
# `scripts/gate/tests/popup-overlay.test.mjs` vergleicht die wirksamen Werte hier
# mit dem Literal der Haelfte — ein anderer Slot hier wird rot, statt still ins
# Leere zu rendern.
#
# PROBE-API, keine Ende-zu-Ende-Funktion: der Host emittiert auf
# `shinon/trajectory`, aber in diesem Baum konsumiert kein Paket den Kanal.
# Das sichtbare Overlay faltet stattdessen das Sitzungsfenster direkt. Der
# Gate-Test `scripts/gate/tests/popup-overlay.test.mjs` pinnt diese Grenze und
# verbietet eine Ende-zu-Ende-Behauptung fuer diesen Kanal.
- id: shinon-popup
  config:
    enabled: true
    slotName: 'conversation.composer.dock'
    trigger: 'user/message'
    showOriginal: true
    showOutput: true
    showProcess: true
    category: 'process-step'
    color: '#ff8800'
    trajectoryChannel: 'shinon/trajectory'
    # ^ Die Kanäle sind EIGENE Namen dieses Pakets und keine zweite
    #   Spine-Wahrheit: den Spine-Kanal (`shinon/event`) liest @shinon/narrative.

    # Key-Router (Zug 6): der Schlüssel-Pool der Modell-Route.
    #
    # DIE ENTSCHEIDUNG IST DER NAME, NICHT DER WERT: `envNames: [ 'AGNES_API_KEY' ]`
    # nennt die Umgebungsvariable, die die Route ohnehin liest (der `agnes`-Block
    # oben, `apiKeyEnv`). Das Schema dieses Pakets hat KEIN Feld für einen
    # Schlüsselwert, und es darf keines bekommen: eine Profildatei ist versioniert.
    # Vorher stand hier `providers[].pool: []` und `defaultKey: ''` — zwei Felder, die
    # einen Schlüssel aufgenommen hätten. Beide sind entfernt.
    #
    # baseUrl wird GESPIEGELT, nicht erfunden: der Verbindungstest fragt die
    # Modellliste ab und muss denselben Host fragen wie die Route. Der Gate-Test
    # `scripts/gate/tests/key-router-security.test.mjs` vergleicht beide Werte — ein
    # anderer Host hier waere ein zweiter Wahrheitsstand ueber denselben Anbieter.
    #
    # initialDelayMs/maxDelayMs/maxRetries sind die Eskalation bei 429: der erste
    # Fehlschlag wartet 2 s, jeder weitere verdoppelt, gedeckelt bei 60 s, mit
    # ±25 % Jitter (assets/pool-core.js; nachgerechnet in packages/key-router/test/).
    #
    # Der Provider-Override ist implementiert: fuer diese envNames klammert
    # key-router credentials.resolve und bedient die Route aus dem Pool; nach
    # RATE_LIMIT wird der verwendete Platz gedeckelt. Tests belegen die Kette bis
    # zum Loopback-Draht. Nicht live belegt ist eine 429-Rotation beim echten
    # Anbieter mit echten Schluesseln (docs/ZAHLEN.md §4).

- id: shinon-key-router
  config:
    providers:
      - id: agnes
        envNames: [ 'AGNES_API_KEY' ]
        baseUrl: https://apihub.agnes-ai.com/v1
        protocol: openai-compatible
        probePath: /models
        initialDelayMs: 2000
        maxDelayMs: 60000
        maxRetries: 5
      # Zweite Plätze für die One-Shot-Route (Phase 5): derselbe Host, eigener
      # Umgebungsname. Der Router meldet Pool-Status für BEIDE Routen; baseUrl
      # muss zur Route `prompter` passen (key-router-security pinnt das).
      - id: prompter
        envNames: [ 'PROMPTER_API_KEY' ]
        baseUrl: https://apihub.agnes-ai.com/v1
        protocol: openai-compatible
        probePath: /models
        initialDelayMs: 2000
        maxDelayMs: 60000
        maxRetries: 5

# Traceability (LS-Popup-Toasts): fluechtige Meldungen unten rechts im Chat.
#
# DIE WIRTSCHAFT DIESES EINTRAGS: er liefert die Grenzen an die Browser-Haelfte,
# mehr tut der Host nicht. Die Haelfte foldet das SITZUNGSSFENSTER selbst
# (uiSession → sessions.binding → eventSource), exakt wie @shinon/popup — ein
# Host-Listener auf `tool/call`/`tool/result`/`step/start`/`agent/error` waere
# tot, weil das Record-Typen des Session-Logs und keine Bus-Events sind
# (belegt an session.v4.jsonl: 199x tool/call, 0 emits in DSH-Libs).
#
# Der Weg zu den Grenzen ist `webserver/index-inject` als
# `window.__SHINON_TRACEABILITY_CONFIG__` — dieselbe Naht, ueber die
# @shinon/markers seine Grenzen ausliefert. Der fruehere Versuch schrieb in
# `globalThis.window` zur Laufzeit und verfiel am Node-Host still.
- id: shinon-traceability
  config:
    enabled: true
    maxVisible: 3
    duration: 4000
