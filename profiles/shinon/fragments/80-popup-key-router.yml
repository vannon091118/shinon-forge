# Popup (Zug 6): das Fortschritts-Overlay ueber dem Eingabefeld.
#
# Der Datenweg ist der Grund, warum dieses Paket lange inaktiv war: ein
# Out-of-Tree-Bundle kann KEINEN Host-Endpunkt registrieren (die Remote-Beitraege
# der Browser-Haelfte sind eine kompilierte Liste in @deepseek-ai/dsh-api-remotes),
# und die Connection-Naht ist reines Anfrage/Antwort ohne Abo. Die Client-Haelfte
# liest deshalb — wie @shinon/token-usage — die SITZUNG: `uiSession.adapter.current`
# nennt die gezeigte Sitzung, `sessions.binding(id).eventSource` traegt das
# Ereignisfenster, und dessen Ereignisse faltet sie selbst (Faltung + Lesart:
# packages/popup/assets/trajectory-core.js, bytegleich gespiegelt).
#
# slotName ist die EINE Angabe, die nicht frei ist: die Client-Haelfte traegt den
# Slot als Literal (sie kann den Host nicht importieren). Der Gate-Test
# `scripts/gate/tests/popup-overlay.test.mjs` vergleicht die wirksamen Werte hier
# mit dem Literal der Haelfte — ein anderer Slot hier wird rot, statt still ins
# Leere zu rendern.
#
# PROBE-API, keine Ende-zu-Ende-Funktion: der Host emittiert auf
# `shinon/trajectory`, aber in diesem Baum konsumiert kein Paket den Kanal.
# Das sichtbare Overlay faltet stattdessen das Sitzungsfenster direkt. Der
# Gate-Test `scripts/gate/tests/popup-overlay.test.mjs` pinnt diese Grenze und
# verbietet eine Ende-zu-Ende-Behauptung fuer diesen Kanal.
- id: shinon-popup
  config:
    enabled: true
    slotName: 'conversation.composer.dock'
    trigger: 'user/message'
    showOriginal: true
    showOutput: true
    showProcess: true
    category: 'process-step'
    color: '#ff8800'
    trajectoryChannel: 'shinon/trajectory'
    # ^ Die Kanäle sind EIGENE Namen dieses Pakets und keine zweite
    #   Spine-Wahrheit: den Spine-Kanal (`shinon/event`) liest @shinon/narrative.

    # Key-Router (Zug 6): der Schlüssel-Pool der Modell-Route.
    #
    # DIE ENTSCHEIDUNG IST DER NAME, NICHT DER WERT: `envNames: [ 'AGNES_API_KEY' ]`
    # nennt die Umgebungsvariable, die die Route ohnehin liest (der `agnes`-Block
    # oben, `apiKeyEnv`). Das Schema dieses Pakets hat KEIN Feld für einen
    # Schlüsselwert, und es darf keines bekommen: eine Profildatei ist versioniert.
    # Vorher stand hier `providers[].pool: []` und `defaultKey: ''` — zwei Felder, die
    # einen Schlüssel aufgenommen hätten. Beide sind entfernt.
    #
    # baseUrl wird GESPIEGELT, nicht erfunden: der Verbindungstest fragt die
    # Modellliste ab und muss denselben Host fragen wie die Route. Der Gate-Test
    # `scripts/gate/tests/key-router-security.test.mjs` vergleicht beide Werte — ein
    # anderer Host hier waere ein zweiter Wahrheitsstand ueber denselben Anbieter.
    #
    # initialDelayMs/maxDelayMs/maxRetries sind die Eskalation bei 429: der erste
    # Fehlschlag wartet 2 s, jeder weitere verdoppelt, gedeckelt bei 60 s, mit
    # ±25 % Jitter (assets/pool-core.js; nachgerechnet in packages/key-router/test/).
    #
    # Der Provider-Override ist implementiert: fuer diese envNames klammert
    # key-router credentials.resolve und bedient die Route aus dem Pool; nach
    # RATE_LIMIT wird der verwendete Platz gedeckelt. Tests belegen die Kette bis
    # zum Loopback-Draht. Nicht live belegt ist eine 429-Rotation beim echten
    # Anbieter mit echten Schluesseln (docs/ZAHLEN.md §4).

- id: shinon-key-router
  config:
    providers:
      - id: agnes
        envNames: [ 'AGNES_API_KEY' ]
        baseUrl: https://apihub.agnes-ai.com/v1
        protocol: openai-compatible
        probePath: /models
        initialDelayMs: 2000
        maxDelayMs: 60000
        maxRetries: 5
      # Zweite Plätze für die One-Shot-Route (Phase 5): derselbe Host, eigener
      # Umgebungsname. Der Router meldet Pool-Status für BEIDE Routen; baseUrl
      # muss zur Route `prompter` passen (key-router-security pinnt das).
      - id: prompter
        envNames: [ 'PROMPTER_API_KEY' ]
        baseUrl: https://apihub.agnes-ai.com/v1
        protocol: openai-compatible
        probePath: /models
        initialDelayMs: 2000
        maxDelayMs: 60000
        maxRetries: 5

