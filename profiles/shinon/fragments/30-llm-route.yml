        models:
          - id: agnes-2.5-flash
            name: Shinon 2.5 Flash
          - id: agnes-2.5-pro-alpha
            name: agnes-2.5-pro-alpha
          - id: agnes-video-2.5-flash
            name: agnes-video-2.5-flash
          - id: agnes-3.0-flash
            name: agnes-3.0-flash
          - id: agnes-image-2.1-flash
            name: agnes-image-2.1-flash
          - id: agnes-video-2.5
