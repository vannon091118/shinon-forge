# Modell-Route über den pi-ai-Adapter. `apiKeyEnv` ist nur ein REFERENZNAME:
# das Secret kommt aus der Umgebung (SHINON_API_KEY), nie aus dieser Datei.
# Ohne gesetzte Variable bleibt die Route konfiguriert-aber-schlüssellos.
#
# WER DIE ROUTE WÄHLT: DER NUTZER. `agent-default-model` ist ein live-Feld
# (`dsh-agent-default-model`), die Modellwahl in der UI schreibt sie über den
# gemounteten `config-editor` (`saveSelection`) in GENAU DIESE Datei. Der Wert
# unten ist deshalb der zuletzt gespeicherte Stand und keine Vorgabe des Repos:
# nach einem Wechsel in der UI steht hier eine andere Route, und das ist die
# Zusage, kein Fehler. Gemessen 2026-10-20: `provider: prompter`,
# `model: agnes-2.5-flash` — beide Provider zeigen auf den Agnes-Host,
# `prompter` liest `PROMPTER_API_KEY`, `agnes` liest `AGNES_API_KEY`.
#
# WAS GEPRÜFT WIRD, IST DIE FORM, NICHT DER NAME
# (`scripts/lib/model-route.mjs`, `scripts/gate/tests/model-route.test.mjs`):
# der Provider muss in diesem Patch definiert sein; eine vorhandene feste
# Modellliste wird geprüft, eine leere Liste steht für den dynamischen DSH-
# Katalog. `apiKeyEnv` muss einen Namen nennen (nie einen Wert).
# Ein Modell-Literal im Test wäre beim nächsten Wechsel rot und würde die Zahl
# ändern statt die Frage. Hart bleibt nur: eine Route OHNE Schlüssel ist
# MISSING_CREDENTIAL — die deepseek-official-Route (dsh-llm-deepseek) ist
# gemountet, hat aber ohne DEEPSEEK_API_KEY keinen. Wer hier eine Route ohne
# gesetzte Variable einträgt, nimmt genau das in Kauf.
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      # Der Katalog kommt vom Anbieter, nicht aus dem Profil: `dsh-llm-pi-ai`
      # loest die Modelle ueber `catalogModels(provider)` auf, der eingebaute
      # pi-ai-Katalog fuehrt 42 Anbieter. Was der Profil-Eintrag beisteuert, ist
      # der SCHLUESSEL (`apiKeyEnv`), der ANZEIGENAME und die DRAHTFORM des
      # Endpunkts (`api`, `baseURL`) — ohne die beiden letzten kann das
      # Modell-Panel des Hosts kein Modell eintragen, das der eingebaute
      # Katalog nicht kennt (`needs an api`). Eine `models`-Liste wuerde den
      # GESAMTEN Katalog ersetzen (resolveRouteModels), deshalb steht hier
      # keine: der Katalog des Anbieters bleibt der Katalog.
      #
      # Ohne gesetzten Schluessel liefert `listModels` leer und der Anbieter
      # faellt aus der Modell-Liste des Hosts (gemessen: `listModels` gibt bei
      # fehlendem Schluessel `[]` zurueck, und `buildModelCatalog` filtert
      # genau solche Gruppen weg). Jeder Eintrag nennt seinen eigenen
      # Umgebungsnamen — der Name ist nicht geraten, sondern aus dem
      # Katalog-Modul gelesen (`@earendil-works/pi-ai/dist/providers/<id>.js`);
      # der Katalog ist die Quelle, das Profil nur die Schluesselreferenz.
      openrouter:
        apiKeyEnv: SHINON_API_KEY
        displayName: OpenRouter
        api: openai-completions
        baseURL: https://openrouter.ai/api/v1
      nvidia:
        apiKeyEnv: NVIDIA_API_KEY
        displayName: NVIDIA
      groq:
        apiKeyEnv: GROQ_API_KEY
        displayName: Groq
      cerebras:
