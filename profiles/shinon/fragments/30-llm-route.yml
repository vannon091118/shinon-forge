          - id: agnes-image-2.5-flash
            name: agnes-image-2.5-flash
          - id: agnes-3.0-pro
            name: agnes-3.0-pro
      # MiniMax M3.1 Flash (free) fehlt im eingebauten pi-ai-Katalog (gemessen
      # am 2026-10-22: der OpenRouter-Katalog fuehrt 396 Modelle, die
      # minimax-Familie endet bei `minimax/minimax-m3`). Eine `models`-Liste am
      # Anbieter `openrouter` wuerde dessen gesamten Katalog ersetzen
      # (resolveRouteModels), daher ein eigener Anbieter mit nur diesem Modell.
      # Gleicher Schluessel wie `openrouter`, Endpunkt von OpenRouter.
      openrouter-free:
        displayName: OpenRouter Free
        apiKeyEnv: SHINON_API_KEY
        api: openai-completions
        baseURL: https://openrouter.ai/api/v1
