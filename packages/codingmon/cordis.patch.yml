- insert:
    - id: shinon-codingmon
      name: '@shinon/codingmon'
      config:
        # XP-Basis je Levelstufe; die Kurve ist kumulativ quadratisch.
        xpPerLevel: 250
        # Wie viele wilde Pets gleichzeitig auf dem Fenster herumlaufen.
        wildLimit: 3
        # Zeitfenster, in dem ein Pet als "idle" gilt (ms).
        idleAfterMs: 4000
