- insert:
    - id: shinon-prompter
      name: '@shinon/prompter'
      config:
        observeEvents: ['agent/pre-step']
        # MIN = nur Rechtschreibung, Grammatik, Zeichensetzung, minimale Struktur.
        mode: MAX
        # Route des One-Shot-Childs. Leer heisst: KEIN Aufruf — der Enhancer
        # haengt am Schritt, meldet 'NO_ROUTE' und der Roh-Prompt gilt.
        # Zum Aktivieren hier eine Route des Profils eintragen, z. B.
        #   provider: agnes
        #   model: agnes-2.5-flash
        # Das ist eine bewusste Entscheidung, weil damit pro Nutzer-Schritt ein
        # zusaetzlicher Modellaufruf entsteht.
        provider: agnes
        model: agnes-2.5-flash
        # MAX: Kontext kommt vom Project Index (shinon.project-index/query-v1)
        # über ctx.get('shinon_index_query'). Index muss aktiv sein (profile verify: stamp).
        # MAX: Kontext aus dem Project Index. Index-Datei (Schema-Platzhalter),
        # echter Kontext zur Laufzeit über ctx.get('shinon_index_query').
        contextPath: './assets/max-context.json'
        maxTokens: 6000  # Ideal für MAX; maximal 15000 möglich, dann länger dauern (unlimitierte Thinking-Token).
        temperature: 0.3
        timeoutMs: 15000
        trace: true
