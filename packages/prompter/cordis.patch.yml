# @shinon/prompter — der interne One-Shot Prompt Enhancer am `agent/pre-step`.
#
# KEINE CONFIG HIER. Das ist Absicht und die Lehre aus dem Fehler bis 2026-10-13:
# die id-gezielte Config in `profiles/<profil>/cordis.patch.yml` ERSETZT diese
# Config, sie mischt nicht. Als hier `mode: MAX` samt Route stand und das Profil
# den Eintrag nur wegen `skillsPath` anfasste, fiel alles auf Schema-Defaults
# zurueck (MIN, leere Route) — der Enhancer mountete, meldete `NO_ROUTE` und
# veredelte nichts. Die Werte sahen wirksam aus und waren es nie.
#
# Wirksame Werte gehoeren ins PROFIL (Repo-Regel: das Paket traegt Schema-Defaults,
# das Profil die Entscheidungen). Wer den Prompter konfigurieren will, aendert
# `profiles/<profil>/cordis.patch.yml` — und `profile-config-override.test.mjs`
# lehnt eine Config in beiden Ebenen ab, damit diese Falle nicht zurueckkommt.
#
# Ohne Profil-Config gilt der Schema-Default `mode: MIN` mit leerer Route: kein
# Aufruf, `NO_ROUTE`, Roh-Prompt. Das ist die sichere Richtung — ein Enhancer,
# der nichts tut, ist besser als einer, der still das Falsche tut.
- insert:
    - id: shinon-prompter
      name: '@shinon/prompter'
