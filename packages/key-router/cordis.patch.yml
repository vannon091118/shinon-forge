# @shinon/key-router — Multi-Schlüssel-Pool mit 429-Rotation
#
# Architektur:
#   Umgebung ──▶ Pool je Anbieter ──▶ Auswahl ──▶ Werkzeuge (status/rotate/probe)
#                                                   │
#                                                   ▼
#                                         bei 429: Cooldown, dann nächster Platz
#
# Die Rechnung (Eskalation, Auswahl, Filtern) steht in `assets/pool-core.js` —
# importfrei und damit in CI testbar (packages/key-router/test/).
#
# SCHLÜSSEL KOMMEN AUS DER UMGEBUNG, NIE AUS EINER DATEI.
#
# KEINE CONFIG HIER — die wirksamen Werte stehen in
# `profiles/shinon/cordis.patch.yml`.
#
# Sie standen bis 2026-10-13 hier: `providers[].pool` (eine Liste, die
# Schlüsselmaterial aufgenommen hätte) und `defaultKey`. BEIDE Felder sind weg —
# nicht aus Ordnung, sondern weil eine Profildatei versioniert ist: ein
# Schlüssel darin wäre ein Leck mit Ansage. Schlüssel kommen aus der Umgebung
# (`envNames`, `envPrefix`), und das Schema dieses Pakets hat kein Feld für einen
# Wert. `scripts/gate/tests/key-router-security.test.mjs` prüft das am Schema.
- insert:
    - id: shinon-key-router
      name: '@shinon/key-router'
