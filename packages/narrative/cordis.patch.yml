# @shinon/narrative — Narrative Engine
#
# Beobachtet Events, baut Chronicle, trackt Arcs und Relationships,
# leitet Composite-Zustand deterministisch ab.
#
# Architektur (aus der Systemanalyse, festgehalten im Dev-Tagebuch):
#   REAL EVENT → OBSERVATION → EVIDENCE → NARRATIVE → PERSONA STATE → VOICE
#
# Niemals umgekehrt. Narrative ist Interpretation, nie technische Autorität.

# KEINE CONFIG HIER — die vier wirksamen Werte stehen in
# `profiles/shinon/cordis.patch.yml`:
#
#   eventsChannel       'shinon/event'  Kanal, auf dem der Spine emittiert
#   chronicleLimit      50              maximale Chronik-Laenge (Hot-Memory)
#   freezeThreshold     20              nach N Takten wechselt der Arc benannt
#   relationshipWindow  20              wie viele Ereignisse die Beziehung sieht
#
# Sie standen bis 2026-10-13 in BEIDEN Ebenen, wortgleich. Das war kein Fehler
# in den Werten, aber dieselbe Falle wie beim Prompter: eine id-gezielte Config
# im Profil ERSETZT die Config des Bundle-Eintrags, sie mischt nicht. Wer hier
# einen Wert geaendert haette, haette nichts bewirkt. `profile-config-override`
# in scripts/gate/tests/ lehnt diese Doppelung jetzt fuer jede id ab.
#
# Ohne Profil-Config gilt der Schema-Default des Pakets.
- insert:
    - id: shinon-narrative
      name: '@shinon/narrative'
